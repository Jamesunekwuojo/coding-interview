[package]
name = "dataroom-api"
version = "0.1.0"
edition = "2024"
default-run = "dataroom-api"

[workspace]

[features]
ts-bridge = []


[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "fs", "signal"] }
tower-cookies = { version = "0.11", features = ["signed"] }
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }
ts-server-fn = "=0.2.0"
ts-server-fn-axum = "=0.1.0"
